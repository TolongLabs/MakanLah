         richest in. Google Fonts subsets it by unicode-range, so a page with no
         Chinese on it downloads none of it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif+SC:wght@400&display=swap"
