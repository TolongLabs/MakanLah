<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12130F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Where to eat in KL, with the post behind every pick." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- og:image must be ABSOLUTE. Facebook, LinkedIn, X and Slack all fetch it
         from their own servers with no page context, so a relative path resolves
         against their host and 404s -- the link renders with no preview at all,
         which is silent and looks like nothing is wrong when you paste it. The
         file existed and served 200; the tag pointing at it was the defect. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MakanLah" />
    <meta property="og:url" content="https://makanlah-b5h.pages.dev/" />
    <meta property="og:title" content="MakanLah" />
    <meta property="og:description" content="Where to eat in KL, with the post behind every pick." />
    <meta property="og:image" content="https://makanlah-b5h.pages.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An ink drawing of a kopitiam table with bak kut teh and a cup of kopi." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MakanLah" />
    <meta name="twitter:description" content="Where to eat in KL, with the post behind every pick." />
    <meta name="twitter:image" content="https://makanlah-b5h.pages.dev/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Serif SC is not optional. Newsreader carries no CJK, and without a serif
         that does, Chinese excerpts fall back to a system sans and the whole
         chrome-versus-testimony distinction collapses on the language the corpus is
         richest in. Google Fonts subsets it by unicode-range, so a page with no
         Chinese on it downloads none of it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>MakanLah</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
