# Unattended, this is the reviewer. docs/AUTONOMY.md gates self-merge on it being
# green, so a check that is skipped or silenced is a review that did not happen.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun run lint shells out to ruff via uv, so uv must exist before it runs.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Every test runs against fixtures. A suite that hits a live platform fails
      # when a session expires, and a red check that means nothing trains everyone
      # to ignore red checks (docs/TRD.md).
      - name: Python tests
        run: bun run test

      - name: Web build and tests
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      # The three docs gate implementation (AGENTS.md). Warn rather than fail:
      # a branch that adds src/ before TRD.md exists should be visible, not blocked
      # at 3am with nobody to unblock it.
      - name: Docs gate
        run: |
          missing=()
          for f in docs/PRODUCT.md docs/PRD.md docs/TRD.md; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ] && [ -d src ]; then
            echo "::warning::src/ exists but the docs gate is incomplete: ${missing[*]}"
          fi

      # Scraped corpora are local-only: volume, and platform terms.
      - name: No scraped corpus committed
        run: |
          if git ls-files | grep -qE '^data/(raw|corpus)/'; then
            echo "::error::a scraped corpus is tracked. It stays local — commit a fixture instead."
            exit 1
          fi

      - name: No secrets committed
        run: |
          if git ls-files | grep -qxE '\.env'; then
            echo "::error::.env is tracked. Only .env.example belongs in git."
            exit 1
          fi

  # The evidence pair is the product's central claim, and jsdom cannot see whether it
  # renders. #20 shipped a corroboration layout that never rendered once, through four
  # green runs and a dozen screenshots, because a container query falling back is
  # silent: the layout stays valid and every DOM assertion still passes.
  #
  # It clears the 34rem bar by 3.34px, so this is not a theoretical guard. A four pixel
  # change to the specimen padding drops it back to one column, verified by mutation.
  layout:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and serve the client
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx vite preview --port 4188 --strictPort --host 127.0.0.1 &
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:4188/ && break
            sleep 0.5
          done

      # Playwright lives at the repo root, not in web/, because it drives the browsers
      # rather than shipping in the client bundle.
      - name: Install the engines
        run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        id: engines
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}

      - if: steps.engines.outputs.cache-hit != 'true'
        run: bunx playwright install chromium firefox

      # Chrome is preinstalled on ubuntu-latest and websockets is already a project
      # dependency, so this needs nothing new. The binary is named google-chrome in
      # some runner images and google-chrome-stable in others.
      - name: The evidence pair must split
        env:
          WEB_BASE: http://127.0.0.1:4188
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)
          [ -n "$CHROME" ] || { echo "::error::no Chrome on the runner, so the layout was never checked"; exit 1; }
          # --with rather than the project: the script needs websockets and stdlib,
          # and resolving the whole project would drag in psycopg and fastapi for nothing.
          CHROME="$CHROME" uv run --no-project --with websockets python scripts/layout_check.py

      # The mascot shipped rendering NOTHING. Every asset returned 200, the WebGL
      # context was live, onReady fired -- and 0% of the canvas had ink in it,
      # because the framing pointed at the empty third above the character's head.
      # The check that existed asserted a live context, which a blank canvas also
      # has. This one screenshots the element and counts pixels.
      - name: The mascot must actually be on screen
        env:
          BASE: http://127.0.0.1:4188
        run: node scripts/mascot_check.mjs

      # The band between phone and desktop had two different gates on two screens and
      # only one of them was ever measured: /discover mounted her from 48rem while
      # /taste held out until 56rem, so a portrait tablet got the wizard with no
      # companion and 549px of empty page under the last option. Geometry only --
      # whether she is PAINTED is the pixel check above; this one asserts she has a
      # box, that the box is the width she is framed for rather than the whole page,
      # and that buying that space did not push the last option under the island.
      - name: The wizard holds at tablet width
        env:
          BASE: http://127.0.0.1:4188
        run: node scripts/taste_tablet_check.mjs

      # Scrollbars, selection, focus, autofill and tooltips are the parts most
      # likely to be left at the OS default, and they do not follow a theme on
      # their own. Each is asserted in BOTH schemes so "theme-aware" means the
      # value actually moves rather than resolving the same twice -- which is what
      # caught a nested :root that had silently killed the entire dark theme.
      - name: The browser chrome must be ours, in both themes
        env:
          BASE: http://127.0.0.1:4188
        run: node scripts/chrome_check.mjs

      # Windows "Animation effects" off and macOS "Reduce motion" both land on
      # prefers-reduced-motion, and people flip them for performance as often as for
      # vestibular reasons. Both engines are checked because they are two separate
      # implementations of the same query, and the failure that matters -- content left
      # invisible because its entrance never ran -- would be silent in either.
      - name: Motion must survive reduced-motion, in both engines
        env:
          WEB_BASE: http://127.0.0.1:4188
        run: node scripts/motion_check.mjs

  # Publishing the client. Gated on `check`, so nothing ships that CI has not passed.
  #
  # It SKIPS rather than fails when the Cloudflare credentials are absent, because a
  # deploy job that reddens CI over a secret nobody has set yet would train everyone to
  # ignore a red check, and docs/AUTONOMY.md makes CI the only reviewer there is.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - id: creds
        name: Are the Cloudflare credentials present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset, so the client was built but not published. See issue #36."
          fi

      - if: steps.creds.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The client defaults to http://127.0.0.1:8000, which an https page cannot call.
      # Until the API is deployed (#6) this is empty on purpose and the app shows its
      # honest "we could not reach the corpus" state rather than hanging.
      - if: steps.creds.outputs.ready == 'true'
        name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          bun install --frozen-lockfile
          bun run build

      # The Live2D model is 4.2 MB of licensed art, gitignored, and present only on the
      # machine that has it. The app degrades to a text panel without it, so a deploy
      # without the binaries is a supported state and must not be a silent one.
      - if: steps.creds.outputs.ready == 'true'
        name: Note what is not being shipped
        run: |
          if [ ! -f web/dist/models/liveroid/LiveroiD_A-Y01/LiveroiD_A-Y01.model3.json ]; then
            echo "::notice::No Live2D model in the build. The mascot ships as its text panel, which is the designed fallback."
          fi

      - if: steps.creds.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy web/dist --project-name=${{ vars.CF_PAGES_PROJECT || 'makanlah' }} --branch=${{ github.head_ref
            || github.ref_name }}

      # A 200 proves nothing here. public/_redirects sends every unknown path to
      # index.html, so a missing asset answers 200 with the HTML shell: that is exactly
      # how the hosted build stayed silently stale for a day. Assert the content type
      # and a plausible size instead.
      - if: steps.creds.outputs.ready == 'true'
        name: Assert the deploy actually serves the build
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [ -n "$URL" ] || { echo "::error::wrangler returned no deployment URL"; exit 1; }
          fail=0
          probe() {
            local path="$1" want="$2"
            local type size
            type=$(curl -sSL -o /dev/null -w '%{content_type}' "$URL$path")
            size=$(curl -sSL -o /dev/null -w '%{size_download}' "$URL$path")
            if [[ "$type" != *"$want"* ]]; then
              echo "::error::$path served '$type' (wanted $want), $size bytes. The SPA fallback is answering, so the asset is missing."
              fail=1
            else
              echo "ok $path  $type  $size bytes"
            fi
          }
          probe /icon-192.png image/png
          probe /og.png image/png
          probe /manifest.webmanifest json
          exit $fail

      - if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        name: Leave the preview URL on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.URL
            const marker = '<!-- preview-deploy -->'
            const body = `${marker}\nPreview: ${url}\n\nA visual change is reviewed here, not from a screenshot. The container-query bug in #20 survived four green CI runs and a dozen screenshots.`
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const existing = (await github.rest.issues.listComments({owner, repo, issue_number}))
              .data.find(c => c.body.includes(marker))
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            else await github.rest.issues.createComment({owner, repo, issue_number, body})
