# The Python stack the scrape spike created. AGENTS.md pins it as uv + ruff, and
# ruff mirrors biome.json so the two formatters cannot disagree about a shared
# file: 120 columns, single quotes.

[project]
name = "makanlah"
version = "0.1.0"
description = "KL restaurant recommendations with the post behind every pick"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored and received sources are never reformatted (AGENTS.md, Documentation
# Hygiene). .agents/skills is installed third-party code; docs/source is the
# verbatim record.
exclude = ["data", "node_modules", ".venv", ".agents/skills", "docs/superpowers", "docs/source"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
