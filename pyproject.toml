# The Python stack the scrape spike created. AGENTS.md pins it as uv + ruff, and
# ruff mirrors biome.json so the two formatters cannot disagree about a shared
# file: 120 columns, single quotes.

[project]
name = "makanlah"
version = "0.1.0"
description = "KL restaurant recommendations with the post behind every pick"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "opencc-python-reimplemented>=0.1.7",
]

# pytest and httpx are only needed to run the suite, so they are a dev group
# rather than a runtime dependency: the API image should not ship a test client.
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored and received sources are never reformatted (AGENTS.md, Documentation
# Hygiene). .agents/skills is installed third-party code; docs/source is the
# verbatim record.
exclude = ["data", "node_modules", ".venv", ".agents/skills", "docs/superpowers", "docs/source"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# B008 forbids a function call in an argument default, which is exactly how
# FastAPI declares a dependency. These three are the framework's own idiom and
# are evaluated once at import, so the rule's actual hazard -- a fresh mutable
# per call -- does not apply. Naming them beats disabling B008 everywhere.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
