# Deploy target for api/. NOT deployed yet: Fly.io has no free allowance and the
# owner's card is unfunded, so this exists so the deploy is one command the
# moment that changes:
#
#   flyctl launch --copy-config --no-deploy      # first time only
#   flyctl secrets set DATABASE_URL=... DASHSCOPE_API_KEY=... OPENROUTER_API_KEY=...
#   flyctl deploy
#
# Singapore is the nearest region to KL. One shared-cpu-1x at 256MB is roughly
# USD 2-3/month, and auto_stop_machines takes it to zero while nobody is asking.

app = "makanlah-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # The corpus is read, never a platform. This process makes no inbound-facing
  # scrape and holds no browser session.
  CORS_ORIGINS = "https://makanlah.pages.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
